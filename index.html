
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong</title>
    <link rel="stylesheet" href="pong.css">
</head>
<body>

    <main id="game">

        <div id="playfield">
            <div id="score1">0</div>
            <div id="score2">0</div>
            <div id="paddle1"></div>
            <div id="paddle2"></div>
            <div id="ball"></div>
        </div>

        <section id="player1">
            <div class="player-menu">
                <h2>PLAYER 1</h2>
            
                <button class="ready-button">NOT READY</button>
                <button class="color-button">COLOR</button>
                <button>PROFILE</button>
            </div>
            <div class="color-menu">
                <h3>CHOOSE YOUR COLOR</h3>

                <button class="blue-button">BLUE</button>
                <button class="green-button">GREEN</button>
                <button class="purple-button">PURPLE</button>
                <button class="back-button">BACK</button>
            </div>
        </section>

        <section id="player2">
            <div class="player-menu">
                <h2>PLAYER 2</h2>
            
                <button class="ready-button">NOT READY</button>
                <button class="color-button">COLOR</button>
                <button>PROFILE</button>
            </div>

            <div class="color-menu">
               <h3>CHOOSE YOUR COLOR</h3>

                <button class="red-button">RED</button>
                <button class="yellow-button">YELLOW</button>
                <button class="orange-button">ORANGE</button>
               <button class="back-button">BACK</button>
           </div>
        </section>

        <div id="countdown"></div>

    </main>

    <script src="pong.js"></script>
</body>
</html>
